services:
  - type: web
    name: new-valley-app
    env: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: GEMINI_API_KEY
        value: ""
      - key: GEMINI_MODEL_NAME
        value: "gemini-flash-latest"
